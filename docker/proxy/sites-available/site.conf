server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Point directly to Laravel's public directory
    root /var/www/ecommerce-laravel/public;
    # root /var/www/html;
    index index.php index.html index.htm index.nginx-debian.html;

    # Logging setup
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    charset utf-8;

    # Handle modern beautiful URLs in Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string =404;
        gzip_static on;        
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Pass PHP scripts to PHP-FPM Container
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deny access to hidden files like .env or .git
    location ~ /\.(?!well-known).*  {
        deny all;
    }

    # Optimize asset loading (Images, CSS, JS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
