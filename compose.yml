name: laravel-env

services:
  # PHP Application
  app:
    build:
      args:
        user: developer
        uid: 1000
      context: ./docker/php
    container_name: laravel-app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/php:/etc/php/8.3/fpm/conf.d/
    depends_on:
      - db
      - redis
    ports:
      - "9000:9000"
    networks:
      - laravel-net

  # Nginx Web Server
  webserver:
    build:
      context: ./docker/nginx
    restart: unless-stopped
    container_name: laravel-nginx
    ports:
      - "8081:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-net

  # MySQL Database
  db:
    image: mysql:8.0
    restart: unless-stopped
    container_name: laravel-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-net

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    container_name: laravel-redis
    volumes:
      - ./docker/redis/data:/data
    ports:
      - "6379:6379"
    networks:
      - laravel-net

  # Optional
  #node:
  #  image: node:18
  #  container_name: laravel-node
  #  working_dir: /var/www/html
  #  volumes:
  #    - ./src:/var/www/html
  #  command: sh -c "npm install && npm run dev"
  #  networks:
  #    - laravel

networks:
  laravel-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
